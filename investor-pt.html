/* PURE CALCULATION START — all money in KRW 10,000 */
function incomeTax(x){x=Math.max(0,x);const brackets=[[1400,.06,0],[5000,.15,126],[8800,.24,576],[15000,.35,1544],[30000,.38,1994],[50000,.40,2594],[100000,.42,3594],[Infinity,.45,6594]];const b=brackets.find(b=>x<=b[0]);return Math.max(0,x*b[1]-b[2]);}
function personTax(cash,taxable,type,person,withholdRate=0){const other=Math.max(0,person.other||0),ded=Math.max(0,person.ded||0),positive=Math.max(0,taxable),base=incomeTax(other-ded);let full=incomeTax(other+positive-ded);if(type==='passive')full=Math.max(full,base+positive*.14);const national=Math.max(0,full-base),local=national*.1,withheld=type==='passive'?positive*.275:Math.max(0,cash)*withholdRate;return{cash,taxable,national,local,total:national+local,withheld,balance:national+local-withheld,after:(cash-national-local)/12,atPayment:(cash-withheld)/12};}
function premiumPaid(p,sublease){return (p.leasePremium||0)+(sublease?(p.subleasePremium||0):0);}
function tenantEligible(s,i){return i!==s.hostIndex&&(s.tenantPerson===undefined||s.tenantPerson==='all'||String(i)===String(s.tenantPerson));}
function subleaseEnabled(s){return s.contractMode==='mixed'||s.structure==='rental';}
function partyCapital(p,sublease){return p.type==='loan'?(p.loanPrincipal||0):p.repair+p.deposit+p.working+premiumPaid(p,sublease);}
function loanTax(cash,p){const interest=Math.max(0,cash),other=Math.max(0,p.other||0),ded=Math.max(0,p.ded||0),finance=Math.max(0,p.otherFinancial||0);
 const total=i=>{const f=finance+i,base=incomeTax(other-ded);return f<=2000?base+finance*.14+i*.25:Math.max(incomeTax(other+f-2000-ded)+2000*.14,base+finance*.14+i*.25);};
 const national=Math.max(0,total(interest)-total(0)),local=national*.1,withheld=interest*.275;return{cash,taxable:interest,national,local,total:national+local,withheld,balance:national+local-withheld,after:(cash-national-local)/12,atPayment:(cash-withheld)/12};}
function investorReturn(p,joint){
 if(p.role==='externalHost')return null;
 const capital=partyCapital(p.person,p.subleaseApplied===undefined?!joint:p.subleaseApplied),rate=x=>capital>0?x/capital*100:null;
 const payback=annual=>capital>0&&annual>0?capital/annual:null;

 }else if(p.role==='investorHost'){
  parts=[summarize('단독사업 잔여 손익 · 운영·투자 구분 없음',p.cash,p.tax.total)];
 }else{
  shareOnly=joint&&!['rental','loan'].includes(p.type)?summarize('투자 지분 배분금',p.cash,p.tax.total):null;
  parts=[shareOnly||summarize(p.type==='loan'?'대여금 이자 · 원금 상환 제외':'전대 순수입 · 건물주 임대료 차감 후',p.cash,p.tax.total)];

function feeVat(amount,mode){
 const domestic=mode==='domestic-extra'||mode==='domestic-included';
 const extra=mode==='domestic-extra'||mode==='foreign-extra';
 const included=mode==='domestic-included'||mode==='foreign-included';
 const vat=extra?amount*.1:included?amount/11:0;
 const cash=amount+(extra?vat:0),base=cash-vat;
 return{cash,base,vat,credit:domestic?vat:0,eligible:domestic?cash:0};
}
function calculateVat(s,grossAnnual,fee){
 const previous=s.portfolioVat?s.portfolioVat.previous:(s.priorMode==='manual'?Math.max(0,s.priorGross||0):grossAnnual);
 const mode=s.portfolioVat?s.portfolioVat.mode:(s.vatExcluded?'general':s.vatMode==='general'?'general':s.vatMode==='simple'?'simple':Math.round(previous*10000)<104000000?'simple':'general');
 // Round to KRW before strict threshold comparisons to avoid floating point drift.
 const exempt=mode==='simple'&&Math.round(grossAnnual*10000)<48000000;
 const eligible=Math.max(0,s.eligiblePurchases||0)+fee.eligible*12;
 const input=Math.max(0,s.eligiblePurchases||0)/11+fee.credit*12;
 const output=mode==='general'?grossAnnual/11:grossAnnual*.25*.1;

 const credit=mode==='general'?rawCredit:exempt?0:Math.min(output,rawCredit);
 const net=exempt?0:output-credit;
 return{mode,previous,exempt,gross:grossAnnual,eligible,input,output,rawCredit,credit,net,payable:Math.max(0,net),refund:Math.max(0,-net)};

// Sold-night shares allocate one site's inventory; listing on more channels never adds nights.
function validateGuestCharges(items){
 if(items===undefined)return [];
 if(!Array.isArray(items)||items.length>20)throw Error('채널 추가요금은 최대 20개입니다.');
 const ids=new Set();
 for(const x of items){
  if(!x||typeof x.id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(x.id)||ids.has(x.id))throw Error('추가요금 ID를 확인하세요.');ids.add(x.id);
  if(typeof x.name!=='string'||!x.name.trim()||x.name.length>60)throw Error('추가요금 항목명을 입력하세요.');
  if(typeof x.amount!=='number'||!Number.isFinite(x.amount)||x.amount<0)throw Error('추가요금은 0 이상의 숫자입니다.');
  if(!['night','stay'].includes(x.basis)||typeof x.commissionable!=='boolean')throw Error('추가요금 부과 기준과 수수료 대상을 확인하세요.');
 }

function validateChannels(rows,requireComplete=true){
 if(!Array.isArray(rows)||(requireComplete&&!rows.length)||rows.length>20)throw Error('채널은 1~20개로 입력하세요.');
 let sum=0;const ids=new Set();
 for(const c of rows){if(typeof c.id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(c.id)||ids.has(c.id))throw Error('채널 ID를 확인하세요.');ids.add(c.id);
 if(typeof c.name!=='string'||(requireComplete&&!c.name.trim())||c.name.length>60)throw Error('채널 이름을 입력하세요.');
 for(const k of ['share','fee','stay'])if(typeof c[k]!=='number'||!Number.isFinite(c[k])||c[k]<0)throw Error('채널 비중·수수료·숙박일수를 확인하세요.');
 if(c.adr!==undefined&&(typeof c.adr!=='number'||!Number.isFinite(c.adr)||c.adr<0))throw Error('채널 1박 단가는 0 이상의 숫자입니다.');
 if(c.taxType!==undefined&&!['lodging','housing','rental','review'].includes(c.taxType))throw Error('채널 거래 유형을 확인하세요.');
 for(const [key,values] of Object.entries({bookingRoute:['platform','direct'],directPayment:['cash','card','mixed'],directCustomer:['consumer','business']}))if(c[key]!==undefined&&!values.includes(c[key]))throw Error('직접 예약의 경로·결제수단·고객 유형을 확인하세요.');
 validateGuestCharges(c.guestCharges);
 if(c.share>100||c.fee>100||c.stay<=0)throw Error('비중·수수료는 0~100%, 숙박일수는 0보다 커야 합니다.');
 if(!['foreign-none','foreign-extra','foreign-included','domestic-extra','domestic-included'].includes(c.vat))throw Error('채널 수수료 증빙을 선택하세요.');sum+=c.share;
 }if(requireComplete&&Math.abs(sum-100)>1e-6)throw Error('채널별 판매박수 비중 합계를 100%로 맞추세요.');return rows;
}
function channelMetrics(rows,nights,revenue,feeBasis,priceBasis='gross'){
 validateChannels(rows);const fee={cash:0,base:0,vat:0,credit:0,eligible:0};let visits=0;
 const detail=rows.map(c=>{
  const type=c.taxType||'lodging',taxable=type!=='housing',n=nights*c.share/100,v=n/c.stay,multiplier=priceBasis==='net'&&taxable?1.1:1;
  const roomRevenue=c.adr===undefined?revenue*c.share/100/(priceBasis==='net'&&!taxable?1.1:1):n*c.adr*multiplier;

function incomeParts(owner){

  if(p.role==='landlord'){add('건물주 임대료',p.grossRent,p.actualExpense,p.cash,p.allocatedTax);return;}
  if(p.role==='investorHost'&&p.investmentReturn?.shareOnly){const weight=Math.max(0,p.taxable),priority=Math.max(0,p.priorityTaxable||0),tax=weight>0?p.allocatedTax*Math.min(1,priority/weight):0;add('호스트 운영 보수',p.priority,0,p.priority,tax);add('투자 지분 배분금',p.shareCash,0,p.shareCash,p.allocatedTax-tax);return;}
  const label=p.role==='externalHost'?'호스트 수익':p.role==='investorHost'?'단독사업 잔여 수익':p.type==='loan'?'대여금 이자':p.type==='rental'?'전대 순수입':'투자 지분 배분금';add(label,p.cash,0,p.cash,p.allocatedTax);
 });return [...map.values()];
}

=\"page-label\">01 / YOUR RETURN\u003c/p>\u003ch1>내 투자, 매달\u003cbr>얼마가 남을까요?\u003c/h1>\u003cdiv class=\"hero\">\u003cp class=\"caption\">예상 월 세후 수령액 ${hasRent?'· 임대수익 포함':''}\u003c/p>\u003cstrong class=\"big\">${nf(d.post/12)}\u003cspan class=\"unit\">만원\u003c/span>\u003c/strong>\u003cp class=\"annual\">연 ${cash(d.post)} · ${d.sites.length}개 숙소 합산\u003c/p>\u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan>총 투자금\u003c/span>\u003cstrong>${cash(d.capital)}\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>세후 연 수익률\u003c/span>\u003cstrong>${pct(d.returnPostRoi)}\u003c/strong>\u003csmall>운영·투자수입 기준\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>세전 연 수익률\u003c/span>\u003cstrong>${pct(d.returnPreRoi)}\u003c/strong>\u003csmall>운영·투자수입 기준\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>수익으로 회수 · 세후\u003c/span>\u003cstrong>${recovery(d.capital,d.returnPost)}\u003c/strong>\u003csmall>원금 반환 일정과 다름\u003c/small>\u003c/div>\u003c/div>${hasHost?`\u003cdiv class=\"note\">\u003cb>호스트 겸임 수익을 구분합니다.\u003c/b>\u003cbr>운영 보수 포함: 세전 ${pct(d.returnPreRoi)} / 세후 ${pct(d.returnPostRoi)}\u003cbr>투자수입만: ${d.separable?`세전 ${pct(d.investmentPreRoi)} / 세후 ${pct(d.investmentPostRoi)}`:'단독사업 수익이라 분리 계산 불가'}\u003c/div>`:''}\u003cp class=\"footnote\">${hasRent?'수령액에는 임대수익이 포함되며, 수익률·회수기간에서는 제외합니다. ':''}금액은 만원. 현재 운영 가정의 예상치이며 수익을 보장하지 않습니다.\u003c/p>\u003c/section>\n \u003csection class=\"pt-slide\" data-slide=\"1\">\u003cp class=\"page-label\">02 / MY PROPERTIES\u003c/p>\u003ch1>어느 숙소에서\u003cbr>얼마를 받을까요?\u003c/h1>\u003cp class=\"muted\">내 투자금과 내 수령액만 표시합니다. 세후액은 개인 합산세금 안분 후 금액입니다.\u003c/p>${d.sites.map(s=>`\u003carticle class=\"card ${s.post\u003c0?'negative':''}\">\u003cdiv class=\"card-head\">\u003cdiv>\u003ch3>${escapeHtml(s.name)}\u003c/h3>\u003cspan class=\"pill\">${escapeHtml(s.contract)}\u003c/span>\u003c/div>\u003cdiv class=\"amount\">${cash(s.post/12)}\u003csmall class=\"muted\"> / 월 세후\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"bar\" role=\"img\" aria-label=\"월 세후 ${cash(s.post/12)}\">\u003ci style=\"width:${Math.abs(s.post/12)/max*100}%\">\u003c/i>\u003c/div>\u003cdiv class=\"metrics-row\">\u003cdiv>\u003csmall>내 투자금\u003c/small>\u003cstrong>${cash(s.capital)}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>월 세전 수령\u003c/small>\u003cstrong>${cash(s.pre/12)}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>세후 연 수익률¹\u003c/small>\u003cstrong>${pct(s.postRoi)}\u003c/strong>\u003c/div>\u003c/div>\u003cdetails>\u003csummary class=\"muted\">내 자금 구성·운영 가정\u003c/summary>\u003cp class=\"muted\">${s.capitalParts.map(p=>`${escapeHtml(p.label)} ${cash(p.value)}`).join(' · ')||'투자금 없음'}\u003c/p>\u003cp class=\"muted\">가동률 ${nf(s.occupancy,2)}% · 연 영업 ${nf(s.days,0)}일 · 평균 1박 ${cash(s.adr)}\u003cbr>${escapeHtml(s.adrBasis)} · ${escapeHtml(s.vatLabel)}\u003c/p>${s.rentalPre?`\u003cp class=\"muted\">내 임대 순수입: 월 세전 ${cash(s.rentalPre/12)} · 세후 ${cash(s.rentalPost/12)} (위 수령액에 포함)\u003c/p>`:''}\u003c/details>\u003c/article>`).join('')}\u003cdiv class=\"card\">\u003cdiv class=\"card-head\">\u003cb>전체 합계\u003c/b>\u003cb>${cash(d.post/12)} / 월 세후\u003c/b>\u003c/div>\u003cp class=\"footnote\">투자금 ${cash(d.capital)} · 연 세전 ${cash(d.pre)} · 연 세후 ${cash(d.post)}\u003c/p>\u003c/div>\u003cp class=\"footnote\">¹ 수익률은 건물주 임대수익 제외, 운영 보수 포함입니다. 숙소별 수익률의 단순 평균이 아닌 합계 투자금 기준으로 계산합니다.\u003c/p>\u003c/section>\n \u003csection class=\"pt-slide\" data-slide=\"2\">\u003cp class=\"page-label\">03 / SETTLEMENT\u003c/p>\u003ch1>내 몫에서 세금을 빼면\u003cbr>최종 수령액입니다.\u003c/h1>\u003cp class=\"muted\">숙소 운영비·부가세·적립금을 반영한 개인 배분액에서 시작합니다.\u003c/p>\u003cdiv class=\"card flow\">\u003cdiv class=\"flow-row\">\u003cspan>내 세전 수령액\u003c/span>\u003cstrong>${cash(d.pre/12)}\u003c/strong>\u003c/div>\u003cdiv class=\"flow-row\">\u003cspan>예상 개인 세금\u003csmall>소득세 + 지방소득세 · 월 환산\u003c/small>\u003c/span>\u003cstrong>− ${cash(d.tax/12)}\u003c/strong>\u003c/div>\u003cdiv class=\"flow-row total\">\u003cspan>월 세후 수령액\u003c/span>\u003cstrong>${cash(d.post/12)}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"summary-title\">\u003ch3>수입 종류별 내역\u003c/h3>\u003cspan>월평균\u003c/span>\u003c/div>\u003cdiv class=\"parts\">${d.parts.map(p=>`\u003cdiv class=\"part\">\u003cspan>${escapeHtml(p.label)}\u003c/span>\u003cb>${cash(p.post/12)}\u003c/b>\u003csmall>세전 ${cash(p.pre/12)} − 세금 ${cash(p.tax/12)}\u003c/small>\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"note\" style=\"margin-top:20px\">연 소득세 ${cash(d.national)} + 지방소득세 ${cash(d.local)}\u003cbr>실효세율 ${pct(d.effectiveRate)} · 세전 현금 대비\u003c/div>\u003cp class=\"footnote\">다른 숙소 소득을 합산한 세금 증가분입니다. 원천징수는 다시 차감하지 않습니다. 건보료·연금·세액공제는 제외하며 실제 입금일의 금액과 다를 수 있습니다.\u003c/p>\u003c/section>\n \u003csection class=\"pt-slide\" data-slide=\"3\">\u003cp class=\"page-label\">04 / BEFORE YOU DECIDE\u003c/p>\u003ch1>수익과 원금은\u003cbr>나눠서 확인하세요.\u003c/h1>\u003cul class=\"rule-list\">\u003cli>\u003cb>① 계약과 내 권리\u003c/b>손익 배분, 보증금 반환 대상, 지급 시기와 중도 해지 조건을 계약서로 확인합니다.\u003c/li>\u003cli>\u003cb>② 수익은 운영 가정입니다\u003c/b>가동률·객단가·비용이 바뀌면 수령액도 달라집니다. 손실이 발생할 수 있습니다.\u003c/li>\u003cli>\u003cb>③ 회수기간의 의미\u003c/b>총 투자금 ÷ 연 운영·투자 수입입니다. 보증금 반환·대여금 원금 상환을 더하지 않습니다.\u003c/li>\u003cli>\u003cb>④ 세금은 개인별로 다릅니다\u003c/b>계약·다른 소득·공제에 따라 달라집니다. 이 자료는 기존 계산기 모형의 추정치입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"note\">${escapeHtml(d.source)}\u003cbr>작성: ${escapeHtml(d.created)} · 금액 단위: 만원\u003cbr>기존 계산기의 입력값 변경은 이 자료에 자동 반영되지 않습니다.\u003c/div>\u003cp class=\"footnote\">이 화면에는 선택한 사람의 결과만 표시합니다. 공유용 HTML에는 다른 사람의 명단·투자내역·원본 입력을 넣지 않습니다.\u003c/p>\u003c/section>`;\n goPage(0);\n}\nfunction goPage(n){activePage=Math.max(0,Math.min(3,n));document.querySelectorAll('[data-slide]').forEach(s=>s.hidden=Number(s.dataset.slide)!==activePage);document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.page)===activePage?'step':'false'));el('pageCount').textContent=(activePage+1)+' / 4';el('prev').disabled=activePage===0;el('next').disabled=activePage===3;window.scrollTo?.({top:0,behavior:'instant'});}\nfunction bindViewer(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>goPage(Number(b.dataset.page)));el('prev').onclick=()=>goPage(activePage-1);el('next').onclick=()=>goPage(activePage+1);document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')goPage(activePage+1);if(e.key==='ArrowLeft')goPage(activePage-1);});}\n";const PT_SHELL="\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"theme-color\" content=\"#173f34\">\u003ctitle>BnB · 투자자 모바일 PT\u003c/title>\u003cstyle>__CSS__\u003c/style>\u003c/head>\u003cbody>\n\u003cheader class=\"topbar\">\u003cdiv class=\"brand\">BnB.\u003csmall>INVESTOR BRIEFING\u003c/small>\u003c/div>\u003cdiv class=\"controls\">\u003cbutton id=\"settings\" class=\"settings-only\">자료·공개 설정\u003c/button>\u003cbutton id=\"present\" class=\"settings-only\">PT 시작\u003c/button>\u003c/div>\u003c/header>\n\u003cmain class=\"wrap\">\u003cdiv id=\"identity\" class=\"identity\">\u003c/div>\u003cp id=\"notice\" role=\"status\" class=\"notice\" hidden>\u003c/p>\u003cdiv id=\"slides\">\u003c/div>\u003cdiv id=\"others\">\u003c/div>\u003cdiv class=\"next-row\">\u003cbutton id=\"prev\">← 이전\u003c/button>\u003cspan id=\"pageCount\" class=\"page-count\">1 / 4\u003c/span>\u003cbutton id=\"next\" class=\"primary\">다음 →\u003c/button>\u003c/div>\u003c/main>\n\u003cnav class=\"bottom\" aria-label=\"투자 브리핑\">\u003cdiv class=\"bottom-inner\">\u003cbutton data-page=\"0\">01 한눈에\u003c/button>\u003cbutton data-page=\"1\">02 숙소별\u003c/button>\u003cbutton data-page=\"2\">03 정산\u003c/button>\u003cbutton data-page=\"3\">04 확인사항\u003c/button>\u003c/div>\u003c/nav>\n__SETTINGS__\n\u003cscript>__SCRIPT__\u003c/script>\u003c/body>\u003c/html>\n";
let ptBook=null,ptResult=null,selectedPerson='',dataSource='예시 시뮬레이션',isDemo=true,presenting=false;
function msg(text){el('notice').textContent=text;el('notice').hidden=!text;}
function createReport(result,personId,{demo=false,source='계산기 입력',created=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}={}){
 if(!result.valid)throw Error('계산 오류를 먼저 해결하세요.');
 const p=result.people.find(x=>x.profile.id===personId);if(!p||!p.rows.length)throw Error('집계에 포함된 숙소의 참여자를 선택하세요.');
 const returns=personSiteReturns(p,'all'),parts=incomeParts(p).map(x=>({label:x.label,pre:x.pre,tax:x.tax,post:x.post}));
 const siteIds=[...new Set(p.rows.map(x=>x.siteId))];
 const sites=siteIds.map(siteId=>{
  const sr=result.sites.find(x=>x.site.id===siteId),rows=p.rows.filter(x=>x.siteId===siteId),ret=returns.rows.find(x=>x.siteId===siteId),personal=sr.state.people.find(x=>x.id===personId),landlord=rows.filter(x=>x.role==='landlord');
  const pre=rows.reduce((a,x)=>a+x.cash,0),tax=rows.reduce((a,x)=>a+x.allocatedTax,0),rentalPre=landlord.reduce((a,x)=>a+x.cash,0),rentalTax=landlord.reduce((a,x)=>a+x.allocatedTax,0);
  const capitalParts=[];
  if(personal)for(const [key,label] of [['deposit','보증금'],['repair','수리비'],['working','운전자금'],['leasePremium','임대차 권리금'],['subleasePremium','전대차 권리금'],['loanPrincipal','대여 원금']]){if(personal[key]>0)capitalParts.push({label,value:personal[key]});}
  const v=sr.result.vat;
  // Explicit allowlist: never copy row.person, book profiles, site bindings, or unrelated sites.
  return{name:sr.site.name,contract:modes[sr.state.contractMode]||'직접 설정',capital:rows.reduce((a,x)=>a+x.capital,0),pre,post:pre-tax,tax,postRoi:ret?.postRoi??null,capitalParts,occupancy:sr.state.occupancy,days:sr.state.days,adr:sr.state.channelMix?sr.state.channelMix.reduce((a,c)=>a+c.adr*c.share/100,0):sr.state.adr,adrBasis:(sr.state.priceBasis==='net'?'과세 단가 VAT 별도':'과세 단가 VAT 포함')+' · 채널 혼합 시 판매박수 가중 평균 · 추가요금 별도',vatLabel:v.housingOnly?'면세 매출':v.mode==='general'?'일반과세':v.exempt?'간이 · 납부의무 면제 추정':'간이과세',rentalPre,rentalPost:rentalPre-rentalTax};
 });
 return{version:1,name:p.profile.name,demo,source,created,capital:p.capital,pre:p.pre,post:p.post,tax:p.tax.total,national:p.tax.national,local:p.tax.local,effectiveRate:p.tax.rate,returnPre:p.returnPre,returnPost:p.returnPost,returnPreRoi:p.preRoi,returnPostRoi:p.postRoi,rentalPre:p.rentalPre,hasHost:p.rows.some(r=>['investorHost','externalHost'].includes(r.role)),separable:p.separable,investmentPreRoi:p.capital>0&&p.separable?p.investmentPre/p.capital*100:null,investmentPostRoi:p.capital>0&&p.separable?p.investmentPost/p.capital*100:null,parts,sites};
}
function pickReport(){return createReport(ptResult,selectedPerson,{demo:isDemo,source:dataSource});}
function loadPortfolio(input,source,demo=false){
 const candidate=clone(validateBook(input)),res=portfolio(candidate);
 if(!res.valid)throw Error(res.errors.map(e=>e.name+': '+e.message).join('\n'));
 if(!res.people.some(p=>p.rows.length))throw Error('집계에 포함된 숙소와 참여자가 없습니다.');
 ptBook=candidate;ptResult=res;dataSource=source;isDemo=demo;
 selectedPerson=(res.people.find(p=>p.profile.id===selectedPerson&&p.rows.length)||res.people.find(p=>p.capital>0&&p.rows.length&&!p.rows.some(r=>['investorHost','externalHost'].includes(r.role)))||res.people.find(p=>p.capital>0&&p.rows.length)||res.people.find(p=>p.rows.length)).profile.id;
 el('hideOthers').checked=true;refreshSelect();el('dataStatus').textContent=source;displayReport(pickReport());renderOthers();msg('');
}
function refreshSelect(){el('person').innerHTML=ptResult.people.filter(p=>p.rows.length).map(p=>`<option value="${escapeHtml(p.profile.id)}" ${p.profile.id===selectedPerson?'selected':''}>${escapeHtml(p.profile.name)}</option>`).join('');}
function renderOthers(){
 el('others').innerHTML='';
 if(el('hideOthers').checked||presenting)return;
 const others=ptResult.people.filter(p=>p.profile.id!==selectedPerson&&p.rows.length);
 el('others').innerHTML=`<section class="card other-card"><h3>발표자용 · 다른 참여자 내역</h3><p class="muted">공유용 HTML에는 포함하지 않습니다.</p>${others.map(p=>`<div class="flow-row"><span>${escapeHtml(p.profile.name)}<small>투자금 ${cash(p.capital)}</small></span><b>${cash(p.post/12)} / 월 세후</b></div>`).join('')}</section>`;
}
function safeJson(value){return JSON.stringify(value).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');}
function createShareHtml(report){
 // This template contains only presentation code and this person's allowlisted results.
 const script=PT_VIEWER+'\nbindViewer();displayReport('+safeJson(report)+');';
 return PT_SHELL.replace('__CSS__',()=>PT_CSS).replace('__SETTINGS__','').replace('__SCRIPT__',()=>script).replace('<body>','<body class="export-only">');
}
function saveShare(){try{selectedPerson=el('person').value||selectedPerson;const report=pickReport();const blob=new Blob([createShareHtml(report)],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BnB-투자자-개인요약.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);el('dataStatus').textContent='선택한 사람의 결과만 공유용 HTML로 저장했습니다.';}catch(e){el('dataStatus').textContent=e.message;}}
function showSetup(){presenting=false;el('present').textContent='PT 시작';el('settings').hidden=false;el('hideOthers').checked=true;renderOthers();refreshSelect();el('setup').showModal();}
function closeSetup(){selectedPerson=el('person').value;displayReport(pickReport());renderOthers();el('setup').close();el('person').innerHTML='';}
function togglePresent(){
 if(presenting){showSetup();return;}
 presenting=true;el('hideOthers').checked=true;renderOthers();el('person').innerHTML='';el('setup').close();el('settings').hidden=true;el('present').textContent='PT 종료';goPage(0);
}
bindViewer();
el('settings').onclick=showSetup;el('present').onclick=togglePresent;el('apply').onclick=()=>{try{closeSetup();}catch(e){el('dataStatus').textContent=e.message;}};
el('share').onclick=saveShare;
el('setup').addEventListener('cancel',()=>{el('person').innerHTML='';});
el('loadLocal').onclick=()=>{try{const raw=localStorage.getItem('bnb-multi-site-portfolio-v1');if(!raw)throw Error('이 브라우저에 계산기 저장 자료가 없습니다. JSON 파일을 불러오세요.');loadPortfolio(JSON.parse(raw),'이 브라우저의 계산기 자료 · 읽은 시점 기준');}catch(e){el('dataStatus').textContent='불러오기 실패: '+e.message;}};
el('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('5MB 이하 JSON 파일을 선택하세요.');loadPortfolio(JSON.parse(await f.text()),'불러온 계산기 JSON · 읽은 시점 기준');}catch(err){el('dataStatus').textContent='불러오기 실패: '+err.message;}e.target.value='';};
el('demo').onclick=()=>loadPortfolio(exampleBook(),'예시 시뮬레이션 · 실제 투자 제안 아님',true);
loadPortfolio(exampleBook(),'예시 시뮬레이션 · 실제 투자 제안 아님',true);
// No automatic read/write of original calculator storage. Imported data stays in memory.
el('person').innerHTML='';
window.BnBInvestorPT={createReport,createShareHtml,loadPortfolio,getReport:()=>activeReport,getResult:()=>ptResult,exampleBook,goPage};
